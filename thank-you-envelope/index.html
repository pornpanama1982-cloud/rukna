<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff0f6">
  <meta name="description" content="จดหมายเล็ก ๆ พร้อมคำขอบคุณน่ารัก ๆ">
  <title>จดหมายขอบคุณ 💌</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <div class="floating-hearts" aria-hidden="true">
      <span>♥</span><span>♡</span><span>♥</span><span>♡</span><span>♥</span>
      <span>♡</span><span>♥</span><span>♡</span><span>♥</span><span>♡</span>
      <span>♥</span><span>♡</span><span>♥</span><span>♡</span><span>♥</span>
    </div>

    <section class="content" aria-labelledby="page-title">
      <p class="eyebrow">a little note for you</p>
      <h1 id="page-title">มีอะไรอยากบอก 💗</h1>
      <p class="subtitle" id="instruction">แตะที่ซองจดหมายเพื่อเปิดอ่านนะ</p>

      <button class="envelope-button" id="envelopeButton"
              type="button" aria-label="เปิดซองจดหมาย" aria-expanded="false">
        <span class="envelope" id="envelope">
          <span class="letter">
            <span class="letter-sparkle sparkle-one">✦</span>
            <span class="letter-heart">♡</span>
            <span class="letter-message">ขอบคุณน้าาา 💗</span>
            <span class="letter-small">ขอบคุณสำหรับ VIP จุก</span>
            <span class="letter-sign">น้องฝากขอบคุณด้้วยยย ♡</span>
            <span class="letter-sparkle sparkle-two">✦</span>
          </span>
          <span class="envelope-back"></span>
          <span class="envelope-front"></span>
          <span class="envelope-flap"></span>
          <span class="seal" aria-hidden="true">♥</span>
        </span>
      </button>

      <p class="hint" id="hint">♡ กดเปิดจดหมายได้เลย ♡</p>
      <button class="replay-button" id="replayButton" type="button" hidden>♡ พับจดหมายกลับ ♡</button>
      <p class="footer-note">THANKS YOU NAA <span>♥</span></p>
    </section>
  </main>
</body>
</html>
